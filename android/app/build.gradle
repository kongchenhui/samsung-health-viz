plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kongchenhui.samsunghealthviz.bridge'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kongchenhui.samsunghealthviz.bridge'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '0.0.8'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 纯 Java、无第三方依赖，关闭不必要的构建特性以保持产物精简
    buildFeatures {
        buildConfig false
        resValues false
        shaders false
    }

    lint {
        abortOnError false
    }
}
