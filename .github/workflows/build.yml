name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  # 网页上「发布 Release」时也触发（网页创建 tag/Release 不会产生 push 事件）
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: mac-arm64
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.pkg
            release/*.zip
            release/*.blockmap

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb

  # 打 tag（v*）时，把三个平台的产物汇总后自动发布到 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: 列出产物（排查用）
        run: find artifacts -type f -maxdepth 3 | sort
      - name: 读取 Release 说明
        id: notes
        shell: bash
        run: |
          f="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then
            echo "body_path=$f" >> "$GITHUB_OUTPUT"
            echo "使用 $f 作为 Release 说明"
          else
            echo "未找到 $f，回退为自动生成说明"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          name: 骑行生涯 ${{ github.ref_name }}
          # Release 说明优先用仓库里的 docs/release-notes/<tag>.md；没有则自动生成
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
          files: |
            artifacts/*.dmg
            artifacts/*.pkg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
          fail_on_unmatched_files: true
